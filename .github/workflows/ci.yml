name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test manifests
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v7
        with:
          # Check the bucket out into a subdirectory: Pester walks the whole
          # tree it is pointed at, so with Scoop core checked out inside the
          # repo it would also run Scoop core's own test suite (which needs
          # lessmsi/innounp and fails on a bare runner).
          fetch-depth: 2
          path: my_bucket

      - name: Checkout Scoop
        uses: actions/checkout@v7
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core

      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module BuildHelpers -Force -Scope CurrentUser
          Install-Module Pester -MinimumVersion 5.2.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run bucket tests
        shell: pwsh
        run: |
          $env:SCOOP_HOME = "$(Convert-Path '.\scoop_core')"
          # Validate every manifest on each run. With CI=true, the bucket test
          # harness only validates files changed by this commit, and that
          # changed-file detection silently returns nothing here - which would
          # make the schema check pass without checking anything.
          $env:CI = 'false'
          .\my_bucket\bin\test.ps1
